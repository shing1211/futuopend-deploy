extends: default

rules:
  braces:
    level: warning
  brackets:
    level: warning
  colons:
    level: warning
  commas:
    level: warning
  comments:
    level: warning
    require-starting-space: true
  comments-indentation:
    level: warning
  document-end:
    level: warning
  document-start:
    level: warning
  empty-lines:
    level: warning
  hyphens:
    level: warning
  indentation:
    level: error
    spaces: 2
  key-duplicates:
    level: error
  line-length:
    level: warning
    max: 120
  new-line-at-end-of-file:
    level: warning
  new-lines:
    level: warning
    type: unix
  trailing-spaces:
    level: warning
  truthy:
    level: warning
