name: Version Bump

# Triggered manually:
#   gh workflow run version-bump.yml -f version=10.12.7208
# Or from the futuopend PR body link after merging the futuopend bump.
#
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'New FutuOpenD version to update to (e.g. 10.12.7208)'
        required: true

permissions:
  contents: write

jobs:
  bump:
    name: Bump to ${{ inputs.version }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate version
        run: |
          NEW_VER="${{ inputs.version }}"
          if ! [[ "$NEW_VER" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "ERROR: Invalid version format: $NEW_VER"
            exit 1
          fi
          echo "Bumping to: $NEW_VER"

      - name: Read current version
        id: current
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let text;
            try {
              text = fs.readFileSync('README.md', 'utf-8');
              const m = text.match(/FutuOpenD-v(\d+\.\d+\.\d+)/);
              if (m) {
                core.setOutput('current_version', m[1]);
                core.info('Current version: ' + m[1]);
                return;
              }
            } catch (e) { }
            try {
              text = fs.readFileSync('FutuOpenD.xml.template', 'utf-8');
              const m = text.match(/v(\d+\.\d+\.\d+)/);
              if (m) {
                core.setOutput('current_version', m[1]);
                core.info('Current version: ' + m[1]);
                return;
              }
            } catch (e) { }
            core.setFailed('Could not determine current FutuOpenD version');

      - name: Patch version files
        run: |
          NEW_VER="${{ inputs.version }}"
          CURRENT="${{ steps.current.outputs.current_version }}"
          echo "Patching $CURRENT -> $NEW_VER..."

          sed -i "s/${CURRENT}/${NEW_VER}/g" README.md
          echo "  patched: README.md"

          if [ -f docs/configuration.md ]; then
            sed -i "s/${CURRENT}/${NEW_VER}/g" docs/configuration.md
            echo "  patched: docs/configuration.md"
          fi

          if [ -f docs/image-variants.md ]; then
            sed -i "s/${CURRENT}/${NEW_VER}/g" docs/image-variants.md
            echo "  patched: docs/image-variants.md"
          fi

          if [ -f FutuOpenD.xml.template ]; then
            sed -i "s/${CURRENT}/${NEW_VER}/g" FutuOpenD.xml.template
            echo "  patched: FutuOpenD.xml.template"
          fi

          echo ""
          echo "Changes:"
          git diff --stat

      - name: Commit and push
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          NEW_VER="${{ inputs.version }}"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "chore(deps): update FutuOpenD to $NEW_VER"
            git push origin main
            echo "Committed and pushed."
          else
            echo "No changes; already at $NEW_VER."
          fi

      - name: Create version tag
        run: |
          NEW_VER="${{ inputs.version }}"
          git fetch origin --tags
          git tag -a "v${NEW_VER}" -m "futuopend-deploy v${NEW_VER}"
          echo "Created tag v${NEW_VER}"

      - name: Push version tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          NEW_VER="${{ inputs.version }}"
          git push origin "v${NEW_VER}"
          echo "Pushed tag v${NEW_VER}"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          NEW_VER="${{ inputs.version }}"
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          {
            echo "## What's Changed"
            echo ""
            if [ -n "$PREV_TAG" ]; then
              git log --no-merges --oneline "${PREV_TAG}..HEAD"
            else
              git log --no-merges --oneline
            fi
            echo ""
            if [ -n "$PREV_TAG" ]; then
              echo "**Full Changelog**: https://github.com/shing1211/futuopend-deploy/compare/${PREV_TAG}...v${NEW_VER}"
            else
              echo "**Full Changelog**: https://github.com/shing1211/futuopend-deploy/commits/v${NEW_VER}"
            fi
          } > "$RUNNER_TEMP/release_body.md"
          gh release create "v${NEW_VER}" \
            --repo shing1211/futuopend-deploy \
            --title "futuopend-deploy v${NEW_VER}" \
            --body-path "$RUNNER_TEMP/release_body.md" \
            --draft=false \
            --prerelease=false
          echo "Release v${NEW_VER} created."

      - name: Summary
        run: |
          echo "## Version Bump: ${{ inputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Updated `futuopend-deploy` to FutuOpenD **${{ inputs.version }}**." >> $GITHUB_STEP_SUMMARY
          echo "Created release **v${{ inputs.version }}**." >> $GITHUB_STEP_SUMMARY
