name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'mkdocs.yml'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'mkdocs.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate docker-compose.yaml
        run: docker compose -f docker-compose.yaml config --quiet

      - name: Validate docker-compose.multi.yaml
        run: docker compose -f docker-compose.multi.yaml config --quiet

      - name: YAML lint
        run: |
          pip install yamllint
          yamllint -c .yamllint.yaml .
        continue-on-error: true

  env-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate .env
        run: |
          if [ -f .env ]; then
            required_vars="FUTU_ACCOUNT"
            for var in $required_vars; do
              if ! grep -q "^${var}=" .env; then
                echo "ERROR: Missing required variable $var in .env"
                exit 1
              fi
            done
            echo ".env validation passed"
          else
            echo "No .env file found, skipping validation"
          fi

      - name: Validate bind-mount sources
        run: |
          # FutuOpenD.xml is mounted read-only with create_host_path:false, so a
          # missing file stops the container. It is gitignored, so CI must supply
          # the template to prove the compose config resolves.
          # Check the directory case first: a missing bind-mount source is
          # silently created as a directory by Docker, which shadows the config
          # and leaves FutuOpenD unable to start.
          if [ -d FutuOpenD.xml ]; then
            echo "ERROR: FutuOpenD.xml is a directory, not a file."
            echo "Docker creates missing bind-mount sources as directories; delete it and"
            echo "run: cp FutuOpenD.xml.template FutuOpenD.xml"
            exit 1
          fi
          if [ ! -f FutuOpenD.xml ]; then
            echo "::warning::FutuOpenD.xml absent (expected: it is gitignored)"
            cp FutuOpenD.xml.template FutuOpenD.xml
            created=1
          else
            echo "FutuOpenD.xml present"
          fi
          # An RSA key is optional. If the mount is enabled, the file must exist,
          # otherwise Docker would create a directory in its place. Match only
          # uncommented lines -- the default is a commented-out example block.
          if grep -Eq '^[[:space:]]*source: \./secrets/rsa_key\.txt' docker-compose.yaml; then
            if [ ! -f secrets/rsa_key.txt ]; then
              echo "ERROR: rsa_key.txt volume is enabled but secrets/rsa_key.txt is missing."
              echo "Either create the key, or comment the volume out in docker-compose.yaml."
              exit 1
            fi
            echo "rsa_key.txt mount is enabled and the file is present"
          else
            echo "rsa_key.txt mount is commented out (optional) - OK"
          fi
          [ "${created:-0}" = "1" ] && rm -f FutuOpenD.xml
          exit 0

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Run ShellCheck on scripts
        uses: ludeeus/action-shellcheck@00cae500b08a931fb5698e11e79bfbd38e612a38 # 2.0.0
        with:
          scandir: './scripts'

  trivy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: 'shing1211/futuopend:latest'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'
          vuln-type: 'os,library'

      - name: Upload to GitHub Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: 'trivy-results.sarif'

  image-tag-verify:
    name: Verify Docker image tag exists
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Extract version from README
        id: extract
        uses: actions/github-script@v7
        with:
          result-encoding: string
          script: |
            const fs = require('fs');
            const content = fs.readFileSync('README.md', 'utf-8');
            const m = content.match(/FutuOpenD-v(\d+\.\d+\.\d+)/);
            const ver = m ? m[1] : '';
            console.log('::set-output name=version::' + ver);
            if (!ver) { throw new Error('Could not extract version from README.md'); }
            return ver;

      - name: Check Docker Hub tag exists
        run: |
          VER="${{ steps.extract.outputs.result }}"
          echo "Referenced FutuOpenD version: $VER"
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
            "https://registry.hub.docker.com/v2/repositories/shing1211/futuopend/tags/${VER}-ubuntu-amd64/")
          echo "Docker Hub HTTP status for ${VER}-ubuntu-amd64: $HTTP_CODE"
          if [ "$HTTP_CODE" = "200" ]; then
            echo "Tag shing1211/futuopend:${VER}-ubuntu-amd64 found on Docker Hub."
          else
            echo "ERROR: Tag shing1211/futuopend:${VER}-ubuntu-amd64 NOT FOUND on Docker Hub (HTTP $HTTP_CODE)."
            echo "Hint: run 'gh workflow run version-bump.yml -f version=$VER' in futuopend-deploy"
            exit 1
          fi
          echo "Docker image tag **$VER** verified." >> $GITHUB_STEP_SUMMARY
