name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'mkdocs.yml'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'mkdocs.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate docker-compose.yaml
        run: docker compose -f docker-compose.yaml config --quiet

      - name: Validate docker-compose.multi.yaml
        run: docker compose -f docker-compose.multi.yaml config --quiet

      - name: YAML lint
        run: |
          pip install yamllint
          yamllint -c .yamllint.yaml .
        continue-on-error: true

  env-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate .env
        run: |
          if [ -f .env ]; then
            required_vars="FUTU_ACCOUNT"
            for var in $required_vars; do
              if ! grep -q "^${var}=" .env; then
                echo "ERROR: Missing required variable $var in .env"
                exit 1
              fi
            done
            echo ".env validation passed"
          else
            echo "No .env file found, skipping validation"
          fi

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Run ShellCheck on scripts
        uses: ludeeus/action-shellcheck@00cae500b08a931fb5698e11e79bfbd38e612a38 # 2.0.0
        with:
          scandir: './scripts'

  trivy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: 'shing1211/futuopend:latest'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'
          vuln-type: 'os,library'

      - name: Upload to GitHub Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: 'trivy-results.sarif'

  image-tag-verify:
    name: Verify Docker image tag exists
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Extract version from README
        id: version
        run: |
          SCRIPT=$(mktemp /tmp/get_ver.XXXXXX.py)
          printf '%s\n' \
            'import re,sys' \
            "with open('README.md','rb') as f: content=f.read()" \
            'text=content.decode("utf-8",errors="replace")' \
            'm=re.search(r"FutuOpenD-v(\\d+\\.\\d+\\.\\d+)",text)' \
            'ver=m.group(1) if m else ""' \
            'print(ver)' \
            "with open(sys.argv[1],'a') as fh: fh.write('version='+ver+'\\n')" \
            'sys.exit(0 if ver else 1)' \
            > "$SCRIPT"
          VER=$(python3 "$SCRIPT" "$GITHUB_OUTPUT"; grep '^version=' "$GITHUB_OUTPUT" | cut -d= -f2)
          echo "Referenced FutuOpenD version: $VER"

      - name: Check tag exists on Docker Hub
        run: |
          VER=$(grep '^version=' "$GITHUB_OUTPUT" | cut -d= -f2)
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
            "https://registry.hub.docker.com/v2/repositories/shing1211/futuopend/tags/${VER}-ubuntu-amd64/")
          if [ "$HTTP_CODE" = "200" ]; then
            echo "Tag shing1211/futuopend:${VER}-ubuntu-amd64 found on Docker Hub."
          else
            echo "ERROR: Tag shing1211/futuopend:${VER}-ubuntu-amd64 NOT FOUND (HTTP $HTTP_CODE)."
            echo "Hint: run 'gh workflow run version-bump.yml -f version=$VER' in futuopend-deploy"
            exit 1
          fi

      - name: Summary
        run: |
          VER=$(grep '^version=' "$GITHUB_OUTPUT" | cut -d= -f2)
          echo "Docker image tag **$VER** verified on Docker Hub." >> $GITHUB_STEP_SUMMARY
