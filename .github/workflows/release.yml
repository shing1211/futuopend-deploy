name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Extract version
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Generate release notes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=${{ steps.version.outputs.VERSION }}
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          cat << 'HEADER' > release-notes.md
          ## What's Changed

          <!-- cSpell:disable -->
          HEADER
          if [ -n "$PREV_TAG" ]; then
            git log --no-merges --oneline "${PREV_TAG}..HEAD" >> release-notes.md || true
          else
            git log --no-merges --oneline >> release-notes.md || true
          fi
          cat << 'FOOTER' >> release-notes.md

          <!-- cSpell:enable -->

          FOOTER
          if [ -n "$PREV_TAG" ]; then
            echo "**Full Changelog**: https://github.com/shing1211/futuopend-deploy/compare/${PREV_TAG}...v${VERSION}" >> release-notes.md
          else
            echo "**Full Changelog**: https://github.com/shing1211/futuopend-deploy/commits/v${VERSION}" >> release-notes.md
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          body_path: release-notes.md
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
