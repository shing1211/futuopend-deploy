services:
  futuopend:
    image: ${FUTU_IMAGE:-shing1211/futuopend:latest}
    container_name: futuopend
    restart: unless-stopped
    platform: linux/${PLATFORM:-amd64}
    env_file:
      - path: .env
        required: false
    environment:
      - TZ=${TZ:-Asia/Hong_Kong}
      - FUTU_IP=${FUTU_IP:-0.0.0.0}
      - FUTU_API_PORT=${FUTU_API_PORT:-11111}
      - FUTU_LANG=${FUTU_LANG:-en}
      - FUTU_LOG_LEVEL=${FUTU_LOG_LEVEL:-info}
      - FUTU_PUSH_PROTO=${FUTU_PUSH_PROTO:-0}
      - FUTU_TELNET_IP=${FUTU_TELNET_IP:-0.0.0.0}
      - FUTU_TELNET_PORT=${FUTU_TELNET_PORT:-22222}
      - FUTU_RSA_KEY=${FUTU_RSA_KEY:-/run/secrets/rsa_key.txt}
      - FUTU_PRICE_REMINDER=${FUTU_PRICE_REMINDER:-1}
      - FUTU_FUTURE_TZ=${FUTU_FUTURE_TZ:-UTC+8}
    volumes:
      # create_host_path:false makes a missing source a hard error. Without it
      # Docker silently creates a *directory* at the source, which shadows the
      # config and leaves FutuOpenD unable to start -- with no useful message.
      - type: bind
        source: ./FutuOpenD.xml
        target: /usr/local/bin/FutuOpenD.xml
        read_only: true
        bind:
          create_host_path: false
      # RSA is opt-in, so the mount is opt-in too. Uncomment once you have a key
      # at ./secrets/rsa_key.txt (see docs/security.md). Leaving it uncommented
      # without the file would make Docker create a directory in its place.
      # - type: bind
      #   source: ./secrets/rsa_key.txt
      #   target: /run/secrets/rsa_key.txt
      #   read_only: true
      #   bind:
      #     create_host_path: false
      - futuopend-data:/home/futuopend/.com.futunn.FutuOpenD
    ports:
      # Host-side binding is the real security boundary. The container's own
      # FUTU_IP / FUTU_TELNET_IP stay 0.0.0.0 because the container has a private
      # network namespace -- only these mappings are reachable from the host.
      # Defaults below expose nothing beyond loopback; see .env.example for the
      # RSA-direct alternative.
      - "${FUTU_API_BIND:-127.0.0.1}:${FUTU_API_PORT_HOST:-11113}:11111"
      - "${FUTU_WS_BIND:-127.0.0.1}:11114:11112"
      - "${FUTU_TELNET_BIND:-127.0.0.1}:22222:22222"
    # No healthcheck override: the image ships a TCP probe of the API port, which
    # is a real service check. Overriding it with `pgrep -x FutuOpenD` would
    # report healthy for a process that is alive but not serving.
    stop_grace_period: 30s
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
        compress: "true"
    labels:
      org.opencontainers.image.title: "FutuOpenD Deploy"
      org.opencontainers.image.description: "Docker Compose configuration for FutuOpenD gateway"
      org.opencontainers.image.source: "https://github.com/shing1211/futuopend-deploy"
      org.opencontainers.image.version: "1.0.4"
      org.opencontainers.image.licenses: "Apache-2.0"
    networks:
      - futuopend-net

networks:
  futuopend-net:
    driver: bridge

volumes:
  futuopend-data:
