services:
  futuopend:
    image: ${FUTU_IMAGE:-shing1211/futuopend:latest}
    container_name: futuopend
    restart: unless-stopped
    platform: linux/${PLATFORM:-amd64}
    env_file:
      - path: .env
        required: false
    environment:
      - TZ=${TZ:-Asia/Hong_Kong}
      - FUTU_IP=${FUTU_IP:-0.0.0.0}
      - FUTU_API_PORT=${FUTU_API_PORT:-11111}
      - FUTU_LANG=${FUTU_LANG:-en}
      - FUTU_LOG_LEVEL=${FUTU_LOG_LEVEL:-info}
      - FUTU_PUSH_PROTO=${FUTU_PUSH_PROTO:-0}
      - FUTU_TELNET_IP=${FUTU_TELNET_IP:-0.0.0.0}
      - FUTU_TELNET_PORT=${FUTU_TELNET_PORT:-22222}
      - FUTU_RSA_KEY=${FUTU_RSA_KEY:-/run/secrets/rsa_key.txt}
      - FUTU_PRICE_REMINDER=${FUTU_PRICE_REMINDER:-1}
      - FUTU_FUTURE_TZ=${FUTU_FUTURE_TZ:-UTC+8}
    volumes:
      - ./FutuOpenD.xml:/usr/local/bin/FutuOpenD.xml:ro
      - ./secrets/rsa_key.txt:/run/secrets/rsa_key.txt:ro
      - futuopend-data:/home/futuopend/.com.futunn.FutuOpenD
    ports:
      - "11113:11111"
      - "11114:11112"
      - "22222:22222"
    healthcheck:
      test: ["CMD", "pgrep", "-x", "FutuOpenD"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    stop_grace_period: 30s
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
        compress: "true"
    labels:
      org.opencontainers.image.title: "FutuOpenD Deploy"
      org.opencontainers.image.description: "Docker Compose configuration for FutuOpenD gateway"
      org.opencontainers.image.source: "https://github.com/shing1211/futuopend-deploy"
      org.opencontainers.image.version: "1.0.4"
      org.opencontainers.image.licenses: "Apache-2.0"
    networks:
      - futuopend-net

networks:
  futuopend-net:
    driver: bridge

volumes:
  futuopend-data:
