# Multi-instance FutuOpenD deployment.
# Run two accounts side-by-side with separate configs and ports.
#
# Usage:
#   mkdir -p secrets-a secrets-b
#   cp FutuOpenD.xml.template secrets-a/FutuOpenD.xml
#   cp FutuOpenD.xml.template secrets-b/FutuOpenD.xml
#   # edit both configs with different accounts
#   docker compose -f docker-compose.multi.yaml up -d
#
services:
  futuopend-a:
    image: ${FUTU_IMAGE:-shing1211/futuopend:latest}
    container_name: futuopend-a
    restart: unless-stopped
    platform: linux/${PLATFORM:-amd64}
    env_file:
      - path: .env-a
        required: false
    environment:
      - TZ=${TZ:-Asia/Hong_Kong}
    volumes:
      - ./secrets-a/FutuOpenD.xml:/run/secrets/FutuOpenD.xml:ro
      - ./secrets-a/rsa_key.txt:/run/secrets/rsa_key.txt:ro
      - futuopend-data-a:/home/futuopend/.com.futunn.FutuOpenD
    ports:
      - "11113:11111"
      - "11114:11112"
    healthcheck:
      test: ["CMD", "pgrep", "-x", "FutuOpenD"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    stop_grace_period: 30s
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
        compress: "true"
    labels:
      org.opencontainers.image.title: "FutuOpenD Deploy (Instance A)"
      org.opencontainers.image.description: "Docker Compose configuration for FutuOpenD gateway - Instance A"
      org.opencontainers.image.source: "https://github.com/shing1211/futuopend-deploy"
      org.opencontainers.image.version: "1.0.4"
      org.opencontainers.image.licenses: "Apache-2.0"
    networks:
      - futuopend-net-a

  futuopend-b:
    image: ${FUTU_IMAGE:-shing1211/futuopend:latest}
    container_name: futuopend-b
    restart: unless-stopped
    platform: linux/${PLATFORM:-amd64}
    env_file:
      - path: .env-b
        required: false
    environment:
      - TZ=${TZ:-Asia/Hong_Kong}
    volumes:
      - ./secrets-b/FutuOpenD.xml:/run/secrets/FutuOpenD.xml:ro
      - ./secrets-b/rsa_key.txt:/run/secrets/rsa_key.txt:ro
      - futuopend-data-b:/home/futuopend/.com.futunn.FutuOpenD
    ports:
      - "21113:11111"
      - "21114:11112"
    healthcheck:
      test: ["CMD", "pgrep", "-x", "FutuOpenD"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    stop_grace_period: 30s
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
        compress: "true"
    labels:
      org.opencontainers.image.title: "FutuOpenD Deploy (Instance B)"
      org.opencontainers.image.description: "Docker Compose configuration for FutuOpenD gateway - Instance B"
      org.opencontainers.image.source: "https://github.com/shing1211/futuopend-deploy"
      org.opencontainers.image.version: "1.0.4"
      org.opencontainers.image.licenses: "Apache-2.0"
    networks:
      - futuopend-net-b

networks:
  futuopend-net-a:
    driver: bridge
  futuopend-net-b:
    driver: bridge

volumes:
  futuopend-data-a:
  futuopend-data-b:
